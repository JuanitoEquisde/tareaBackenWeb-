<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Panel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #1e3a8a, #1a56db); }
        .badge-rol.admin { background: #fef2f2; color: #dc2626; }
        .badge-rol.user { background: #eff6ff; color: #1a56db; }
        .badge-estado.activo { background: #dcfce7; color: #16a34a; }
        .badge-estado.inactivo { background: #fef3c7; color: #d97706; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">
            <i class="fas fa-shield-alt me-2"></i>Admin NotyGo
        </a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white" th:text="${session.usuarioLogueado}">Admin</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Gestión de Usuarios</h2>

    <!-- Filtros -->
    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/admin/usuarios}" method="get" class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" name="nombre"
                           placeholder="Buscar por nombre"
                           th:value="${filtroNombre}">
                </div>
                <div class="col-md-3">
                    <input type="email" class="form-control" name="email"
                           placeholder="Buscar por email"
                           th:value="${filtroEmail}">
                </div>
                <div class="col-md-2">
                    <select class="form-select" name="estado">
                        <option value="">Todos los estados</option>
                        <option value="ACTIVO" th:selected="${filtroEstado == 'ACTIVO'}">Activo</option>
                        <option value="INACTIVO" th:selected="${filtroEstado == 'INACTIVO'}">Inactivo</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search me-1"></i>Buscar
                    </button>
                </div>
                <div class="col-md-2">
                    <a th:href="@{/admin/usuarios}" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-redo me-1"></i>Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla de Usuarios -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th class="text-end pe-4">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- ✅ Iteración segura con usuarios -->
                    <tr th:each="usuario : ${usuarios != null ? usuarios : {}}">
                        <td class="ps-4" th:text="${usuario.id}">1</td>
                        <td th:text="${usuario.nombre}">Nombre</td>
                        <td th:text="${usuario.email}">email@test.com</td>
                        <td>
                                <span class="badge badge-rol"
                                      th:classappend="${usuario.admin} ? 'admin' : 'user'"
                                      th:text="${usuario.admin} ? 'ADMIN' : 'USER'">
                                    USER
                                </span>
                        </td>
                        <td>
                                <span class="badge badge-estado"
                                      th:classappend="${usuario.estado == 'ACTIVO'} ? 'activo' : 'inactivo'"
                                      th:text="${usuario.estado}">
                                    ACTIVO
                                </span>
                        </td>
                        <td class="text-end pe-4">
                            <button type="button"
                                    class="btn btn-sm btn-outline-primary"
                                    th:data-usuario-id="${usuario.id}"
                                    th:data-usuario-nombre="${usuario.nombre}"
                                    th:data-usuario-email="${usuario.email}"
                                    th:data-usuario-rol="${usuario.rol?.id}"
                                    th:data-usuario-estado="${usuario.estado}"
                                    onclick="abrirModalEditar(this)">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                        </td>
                    </tr>

                    <!-- ✅ Mensaje si no hay usuarios -->
                    <tr th:if="${usuarios == null or #lists.isEmpty(usuarios)}">
                        <td colspan="6" class="text-center py-4 text-muted">
                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                            No se encontraron usuarios
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="text-center mt-4">
        <a th:href="@{/admin/dashboard}" class="btn btn-secondary">
            <i class="fas fa-arrow-left me-1"></i>Volver al Dashboard
        </a>
    </div>
</div>

<!-- ==========================================
     MODAL EDITAR USUARIO
     ========================================== -->
<div class="modal fade" id="modalEditarUsuario" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">
                    <i class="fas fa-user-edit me-2"></i>Editar Usuario
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="formEditarUsuario">
                <div class="modal-body">
                    <input type="hidden" id="editUsuarioId">

                    <div class="mb-3">
                        <label for="editNombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="editNombre" required>
                    </div>

                    <div class="mb-3">
                        <label for="editEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="editEmail" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="editRol" class="form-label">Rol</label>
                            <select class="form-select" id="editRol" required>
                                <option value="">Seleccionar...</option>
                                <option value="1">Administrador</option>
                                <option value="2">Usuario Estandar</option>
                                <option value="3">Premium</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="editEstado" class="form-label">Estado</label>
                            <select class="form-select" id="editEstado" required>
                                <option value="ACTIVO">Activo</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="editPassword" class="form-label">
                            Nueva Contraseña <small class="text-muted">(dejar en blanco para mantener)</small>
                        </label>
                        <input type="password" class="form-control" id="editPassword" placeholder="••••••••">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i>Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Toast de notificaciones -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="toastNotificacion" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="fas fa-check-circle me-2"></i>
                <span id="toastMensaje">Operación exitosa</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ==========================================
    // FUNCIONES DEL MODAL DE EDICIÓN
    // ==========================================

    // Abrir modal y cargar datos del usuario
    async function abrirModalEditar(btn) {
        const usuarioId = btn.getAttribute('data-usuario-id');
        console.log('🔍 Intentando cargar usuario ID:', usuarioId);

        try {
            // Mostrar modal
            const modal = new bootstrap.Modal(document.getElementById('modalEditarUsuario'));
            modal.show();

            // Cargar datos del usuario desde API
            console.log('📡 Fetching: /admin/api/usuarios/' + usuarioId);
            const response = await fetch(`/admin/api/usuarios/${usuarioId}`);

            console.log('📥 Response status:', response.status);

            if (!response.ok) {
                const errorText = await response.text();
                console.error('❌ Error HTTP:', response.status, errorText);
                throw new Error(`Error ${response.status}: ${errorText}`);
            }

            const usuario = await response.json();
            console.log('✅ Usuario cargado:', usuario);

            // Llenar formulario
            document.getElementById('editUsuarioId').value = usuario.id;
            document.getElementById('editNombre').value = usuario.nombre || '';
            document.getElementById('editEmail').value = usuario.email || '';
            document.getElementById('editRol').value = usuario.rolId || '';
            document.getElementById('editEstado').value = usuario.estado || 'ACTIVO';
            document.getElementById('editPassword').value = '';

            console.log('✅ Formulario llenado correctamente');

        } catch (error) {
            console.error('💥 Error en abrirModalEditar:', error);
            mostrarToast('Error al cargar los datos del usuario: ' + error.message, 'error');

            // Cerrar modal si está abierto
            const modalEl = document.getElementById('modalEditarUsuario');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
        }
    }

    // Submit del formulario
    document.getElementById('formEditarUsuario')?.addEventListener('submit', async function(e) {
        e.preventDefault();

        const usuarioId = document.getElementById('editUsuarioId').value;
        const formData = {
            nombre: document.getElementById('editNombre').value,
            email: document.getElementById('editEmail').value,
            rolId: parseInt(document.getElementById('editRol').value),
            estado: document.getElementById('editEstado').value,
            password: document.getElementById('editPassword').value
        };

        try {
            console.log('📡 PUT: /admin/api/usuarios/' + usuarioId + '/actualizar');
            const response = await fetch(`/admin/api/usuarios/${usuarioId}/actualizar`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            if (response.ok) {
                // Cerrar modal
                bootstrap.Modal.getInstance(document.getElementById('modalEditarUsuario'))?.hide();

                // Mostrar éxito
                mostrarToast('Usuario actualizado correctamente');

                // Recargar página después de 1 segundo
                setTimeout(() => location.reload(), 1000);
            } else {
                const error = await response.text();
                console.error('❌ Error al actualizar:', error);
                mostrarToast(error || 'Error al actualizar usuario', 'error');
            }
        } catch (error) {
            console.error('💥 Error de conexión:', error);
            mostrarToast('Error de conexión al actualizar', 'error');
        }
    });

    // Mostrar toast de notificación
    function mostrarToast(mensaje, tipo = 'success') {
        const toastEl = document.getElementById('toastNotificacion');
        const toastBody = toastEl.querySelector('.toast-body');

        // Actualizar color según tipo
        toastEl.className = `toast align-items-center text-white border-0 ${tipo === 'success' ? 'bg-success' : 'bg-danger'}`;

        // Actualizar mensaje
        const icono = tipo === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
        toastBody.innerHTML = `<i class="fas ${icono} me-2"></i><span>${mensaje}</span>`;

        // Mostrar toast
        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }
</script>

</body>
</html>
