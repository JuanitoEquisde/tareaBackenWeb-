<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ====== FRAGMENTO NAVBAR COMPLETO ====== -->
<nav th:fragment="navbar_cliente" class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container-fluid px-3 px-md-4 d-flex align-items-center gap-2">

        <!-- Botón hamburguesa -->
        <button class="btn btn-link menu-toggle d-lg-none"
                id="menuToggle"
                aria-label="Abrir menú lateral"
                aria-expanded="false"
                aria-controls="sidebar">
            <i class="fas fa-bars" id="menuToggleIcon"></i>
        </button>

        <a class="navbar-brand d-flex align-items-center" th:href="@{/cliente/home}">
            <i class="fas fa-calendar-check me-2"></i>
            <span class="brand-text">NotyGo</span>
        </a>

        <!-- Búsqueda desktop -->
        <div class="d-none d-lg-block ms-3 flex-grow-1" style="max-width:380px;">
            <form class="d-flex search-form" role="search" th:action="@{/cliente/tareas/buscar}" method="get">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-search"></i></span>
                    <input class="form-control" type="search" name="q" placeholder="Buscar tareas..." aria-label="Buscar">
                </div>
            </form>
        </div>

        <!-- Acciones derecha -->
        <div class="nav-actions ms-auto">
            <button class="btn btn-create-task" data-bs-toggle="modal" data-bs-target="#modalNuevaTarea">
                <i class="fas fa-plus"></i>
                <span class="d-none d-sm-inline">Nueva Tarea</span>
            </button>

            <!-- 🔔 CAMPANITA DE NOTIFICACIONES -->
            <div class="dropdown">
                <a class="nav-link position-relative" href="#" role="button"
                   data-bs-toggle="dropdown" id="btnNotificaciones" onclick="cargarNotificaciones()">
                    <i class="fas fa-bell fa-lg"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          id="notifBadge" style="font-size:0.62rem; display:none;">0</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow" style="width: 350px; max-height: 400px; overflow-y: auto;">
                    <li class="dropdown-header d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-inbox me-2"></i>Mensajes del Sistema</span>
                        <button class="btn btn-sm btn-link text-primary" onclick="marcarTodasLeidas()" style="font-size:0.75rem;">
                            Marcar todas como leídas
                        </button>
                    </li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <div id="listaNotificaciones">
                        <li><span class="dropdown-item text-muted text-center small">Cargando...</span></li>
                    </div>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li class="text-center p-2">
                        <a href="#" class="btn btn-sm btn-outline-primary w-100" onclick="cargarNotificaciones()">
                            Ver todas
                        </a>
                    </li>
                </ul>
            </div>

            <!-- Perfil -->
            <div class="dropdown">
                <a class="nav-link dropdown-toggle d-flex align-items-center gap-2" href="#" role="button"
                   data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="avatar" th:classappend="${usuario.esPremium} ? 'premium' : ''">
                        <span th:text="${#strings.toUpperCase(usuario.nombre.length() >= 2 ? #strings.substring(usuario.nombre, 0, 2) : usuario.nombre)}">US</span>
                    </div>
                    <span class="d-none d-md-inline" style="font-size:0.875rem; font-weight:700;"
                          th:text="${usuario.nombre}">Usuario</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow">
                    <li>
                        <h6 class="dropdown-header text-center">
                            <span th:text="${usuario.nombre}">Usuario</span>
                            <small class="d-block text-muted" th:text="${usuario.rol.nombre}">Rol</small>
                        </h6>
                    </li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li><a class="dropdown-item" th:href="@{/cliente/perfil}"><i class="fas fa-user me-2 text-primary"></i>Mi Perfil</a></li>
                    <li><a class="dropdown-item" th:href="@{/cliente/configuracion}"><i class="fas fa-cog me-2 text-secondary"></i>Configuración</a></li>
                    <li><hr class="dropdown-divider my-1"></li>
                    <li>
                        <form th:action="@{/logout}" method="post" class="w-100" style="margin:0;padding:0;">
                            <button type="submit" class="dropdown-item text-danger border-0 bg-transparent w-100 text-start px-3 py-2" style="cursor:pointer;font-weight:700;">
                                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</nav>

<!-- ====== MODAL VER TODAS LAS NOTIFICACIONES ====== -->
<div th:fragment="modal_notificaciones" class="modal fade" id="modalNotificaciones" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">
                    <i class="fas fa-inbox me-2"></i>Mensajes del Sistema
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-0">
                <div id="modalListaNotificaciones" style="max-height: 500px; overflow-y: auto;">
                    <!-- Se cargará dinámicamente -->
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                <button type="button" class="btn btn-primary" onclick="marcarTodasLeidas()">
                    <i class="fas fa-check-double me-1"></i>Marcar todas como leídas
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
