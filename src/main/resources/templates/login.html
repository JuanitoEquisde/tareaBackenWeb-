<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NotyGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --blue-500: #3b82f6;
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --blue-100: #dbeafe;
            --blue-50:  #eff6ff;
            --gray-50:  #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --radius: 20px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1rem;
            overflow-x: hidden;
            position: relative;
        }

        /* ── Ilustraciones laterales ── */
        .side-art {
            position: fixed;
            bottom: 0;
            width: clamp(180px, 22vw, 300px);
            pointer-events: none;
            z-index: 1;
        }
        .side-art.left  { left: 0; }
        .side-art.right { right: 0; transform: scaleX(-1); }

        @media(max-width: 860px) { .side-art { display: none; } }

        /* ── Card (SOLO MÁS ANCHA HORIZONTALMENTE) ── */
        .login-card {
            background: #fff;
            border-radius: var(--radius);
            box-shadow: 0 8px 48px rgba(30,64,175,.10), 0 1px 6px rgba(0,0,0,.05);
            width: 520px; /* Aumentado drásticamente a lo ancho */
            max-width: 100%;
            /* Arriba: 3rem | Izquierda/Derecha: 4rem (mucho espacio) | Abajo: 2.5rem */
            padding: 3rem 4rem 2.5rem;
            position: relative;
            z-index: 10;
            animation: cardIn .6s cubic-bezier(.22,1,.36,1) both;
            margin: auto;
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(28px) scale(.97); }
            to   { opacity:1; transform:translateY(0) scale(1); }
        }

        /* ── Logo ── */
        .logo-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem; /* Restaurado para no hacerla alta */
            gap: .5rem;
        }
        .logo-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--blue-600), var(--blue-500));
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: #fff;
            box-shadow: 0 6px 20px rgba(37,99,235,.28);
            animation: popIn .7s cubic-bezier(.34,1.56,.64,1) .1s both;
        }
        @keyframes popIn {
            from { transform: scale(.3) rotate(-20deg); opacity:0; }
            to   { transform: scale(1) rotate(0deg); opacity:1; }
        }
        .logo-name {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: var(--gray-800);
            letter-spacing: .5px;
            line-height: 1;
        }
        .logo-tagline {
            font-size: .75rem;
            color: var(--gray-400);
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        /* ── Headings ── */
        .card-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--gray-800);
            text-align: center;
            margin-bottom: .4rem;
            line-height: 1.3;
            letter-spacing: -.2px;
        }
        .card-subtitle {
            font-size: .88rem;
            color: var(--gray-400);
            font-weight: 600;
            text-align: center;
            margin-bottom: 2rem; /* Restaurado */
            line-height: 1.5;
        }

        /* ── Alert ── */
        .alert-danger {
            background: #fef2f2;
            border: 1.5px solid #fecaca;
            color: #b91c1c;
            border-radius: var(--radius-sm);
            font-size: .85rem;
            font-weight: 700;
            padding: .8rem 1.1rem;
            margin-bottom: 1.4rem;
            line-height: 1.5;
            animation: shake .4s both;
        }
        @keyframes shake {
            0%,100%{transform:translateX(0)}
            25%{transform:translateX(-6px)}
            75%{transform:translateX(6px)}
        }

        /* ── Labels ── */
        .form-label {
            font-size: .8rem;
            font-weight: 800;
            color: var(--gray-700);
            letter-spacing: .07em;
            text-transform: uppercase;
            margin-bottom: .5rem;
            display: block;
        }

        /* ── Inputs ── */
        .form-control {
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-sm);
            padding: .78rem 1.1rem;
            font-size: .95rem;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            color: var(--gray-800);
            background: var(--gray-50);
            width: 100%; /* Estirará para llenar el nuevo ancho horizontal */
            transition: border-color .2s, box-shadow .2s, background .2s;
            line-height: 1.5;
        }
        .form-control::placeholder { color: var(--gray-400); font-weight: 500; }
        .form-control:focus {
            outline: none;
            border-color: var(--blue-500);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }

        /* ── Password wrapper ── */
        .pw-wrap { position: relative; }
        .pw-wrap .form-control { padding-right: 3.2rem; }
        .toggle-password {
            position: absolute; right: .9rem; top: 50%;
            transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            color: var(--gray-400); font-size: .95rem;
            transition: color .2s; line-height:1; padding:.2rem;
        }
        .toggle-password:hover { color: var(--blue-500); }
        .toggle-password .fa-eye-slash { display: none; }
        .toggle-password.active .fa-eye { display: none; }
        .toggle-password.active .fa-eye-slash { display: inline; }

        /* ── Checkbox ── */
        .form-check { display: flex; align-items: center; gap: .6rem; margin-bottom: 0; }
        .form-check-input {
            width: 18px; height: 18px;
            border-radius: 5px;
            border: 2px solid var(--gray-200);
            cursor: pointer; flex-shrink: 0;
            margin: 0;
        }
        .form-check-input:checked { background-color: var(--blue-600); border-color: var(--blue-600); }
        .form-check-label {
            font-size: .875rem;
            color: var(--gray-500);
            font-weight: 600;
            cursor: pointer;
            line-height: 1;
        }

        /* ── Button ── */
        .btn-login {
            background: linear-gradient(135deg, var(--blue-600) 0%, var(--blue-700) 100%);
            border: none;
            border-radius: var(--radius-sm);
            padding: .88rem 1rem;
            font-size: .98rem;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            letter-spacing: .04em;
            color: #fff;
            width: 100%;
            position: relative; overflow: hidden;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 4px 18px rgba(37,99,235,.32);
            cursor: pointer;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(37,99,235,.42); }
        .btn-login:active { transform: translateY(0); }
        .btn-login .ripple {
            position: absolute; border-radius: 50%;
            background: rgba(255,255,255,.28);
            transform: scale(0);
            animation: rippleAnim .55s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim { to { transform: scale(4); opacity:0; } }

        /* ── Divider ── */
        .divider {
            display: flex; align-items: center; gap: .8rem;
            margin: 1.5rem 0; /* Restaurado */
            color: var(--gray-400); font-size: .75rem; font-weight: 700;
        }
        .divider::before, .divider::after {
            content:''; flex:1; height:1.5px; background: var(--gray-200);
        }

        /* ── Links ── */
        .link-primary {
            color: var(--blue-600); font-weight: 800; font-size: .88rem;
            text-decoration: none; transition: color .2s;
        }
        .link-primary:hover { color: var(--blue-700); text-decoration: underline; }
        .muted { color: var(--gray-400); font-size: .88rem; font-weight: 600; }

        /* ── Spacing helpers ── */
        .mb-field { margin-bottom: 1.25rem; } /* Restaurado */
        .mt-links { margin-top: 1rem; text-align: center; line-height: 1.8; }

        /* ══════════════════════════════════════════
           RESPONSIVE (Ajuste sutil de letras)
        ══════════════════════════════════════════ */
        @media(max-width: 520px) {
            .login-card {
                padding: 2.2rem 1.6rem 2rem;
            }
            .logo-name { font-size: 1.8rem; }
            .card-title { font-size: 1.25rem; }
            .card-subtitle { font-size: .85rem; margin-bottom: 1.5rem; }
            .form-control {
                font-size: .9rem;
                padding: .75rem 1rem;
            }
            .form-label { font-size: .75rem; }
            .btn-login { font-size: .95rem; padding: .85rem 1rem; }
            .mb-field { margin-bottom: 1.1rem; }
        }

        @media(max-width: 380px) {
            .login-card {
                padding: 1.8rem 1.2rem 1.6rem;
                border-radius: 16px;
            }
            .logo-name { font-size: 1.6rem; }
            .card-title { font-size: 1.15rem; }
            .logo-icon { width: 46px; height: 46px; font-size: 1.2rem; }
        }

        /* Responsividad Vertical (Pantallas bajas / Modo horizontal de móviles) */
        @media (max-height: 700px) {
            body {
                align-items: flex-start;
                overflow-y: auto;
            }
            .login-card {
                margin-top: 1rem;
                margin-bottom: 5rem;
                padding-top: 1.5rem;
                padding-bottom: 1.5rem;
            }
            .logo-wrap { margin-bottom: 1rem; }
            .card-subtitle { margin-bottom: 1rem; }
            .mb-field { margin-bottom: 0.8rem; }
            .divider { margin: 0.8rem 0; }
        }

        /* ══════════════════════════════
           MASCOTA
        ══════════════════════════════ */
        #mascot-wrap {
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 500;
            pointer-events: none;
            transform-origin: bottom center;
        }
        #mascot-wrap svg {
            pointer-events: all;
            cursor: pointer;
            display: block;
        }
        .speech {
            position: fixed;
            font-family: 'Fredoka One', cursive;
            font-size: 1.05rem;
            color: var(--gray-800);
            letter-spacing: .01em;
            pointer-events: none;
            z-index: 501;
            white-space: nowrap;
            opacity: 0;
            transition: opacity .3s;
        }
        .speech.visible { opacity: 1; }
    </style>
</head>

<!-- ── Card login ── -->
<div class="login-card" id="loginCard">

    <div class="logo-wrap">
        <div class="logo-icon"><i class="fas fa-check-double"></i></div>
        <div class="logo-name">NotyGo</div>
        <div class="logo-tagline">Organiza · Recuerda · Logra</div>
    </div>

    <p class="card-title">Bienvenido de vuelta</p>
    <p class="card-subtitle">Ingresa tus datos para continuar</p>

    <div th:if="${error}" class="alert alert-danger" id="errorAlert" role="alert">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${error}">Correo o contraseña incorrecta</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-field">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" name="email"
                   placeholder="tu@email.com" required autofocus>
        </div>

        <div class="mb-field">
            <label for="password" class="form-label">Contraseña</label>
            <div class="pw-wrap">
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="••••••••" required>
                <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                    <i class="fas fa-eye"></i>
                    <i class="fas fa-eye-slash"></i>
                </button>
            </div>
        </div>

        <div class="mb-field">
            <div class="form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                <label class="form-check-label" for="rememberMe">Recordarme</label>
            </div>
        </div>

        <button type="submit" class="btn-login" id="submitBtn">
            Iniciar Sesión
        </button>

        <div class="divider">o</div>

        <div class="mt-links">
            <a th:href="@{/login/invitado}" class="link-primary">
                <i class="fas fa-user-secret me-1" style="font-size:.8rem"></i>
                Continuar como Invitado
            </a><br>
            <span class="muted">¿No tienes una cuenta? </span>
            <a th:href="@{/registro}" class="link-primary">Regístrate</a>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /* ── Toggle password ── */
    const toggleBtn = document.getElementById('togglePassword');
    const pwInput   = document.getElementById('password');
    toggleBtn.addEventListener('click', () => {
        pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
        toggleBtn.classList.toggle('active');
    });

    /* ── Ripple ── */
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.addEventListener('click', function(e) {
        const r = document.createElement('span');
        r.classList.add('ripple');
        const rect = this.getBoundingClientRect(), sz = Math.max(rect.width, rect.height);
        r.style.cssText = `width:${sz}px;height:${sz}px;left:${e.clientX-rect.left-sz/2}px;top:${e.clientY-rect.top-sz/2}px`;
        this.appendChild(r);
        setTimeout(() => r.remove(), 600);
    });

    /* ── Stagger inputs ── */
    document.querySelectorAll('.form-control').forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = `opacity .4s ease ${i*.1+.2}s, transform .4s ease ${i*.1+.2}s, border-color .2s, box-shadow .2s, background .2s`;
        requestAnimationFrame(() => requestAnimationFrame(() => {
            el.style.opacity = '1'; el.style.transform = 'translateY(0)';
        }));
    });

    /* ════════════════════════════════════════════
       MASCOTA
    ════════════════════════════════════════════ */
    const wrap    = document.getElementById('mascot-wrap');
    const mascSvg = document.getElementById('mascot-svg');
    const pupilL  = document.getElementById('pupil-l');
    const pupilR  = document.getElementById('pupil-r');
    const mouth   = document.getElementById('mouth');
    const legL    = document.getElementById('leg-l');
    const legR    = document.getElementById('leg-r');
    const shoeL   = document.getElementById('shoe-l');
    const shoeR   = document.getElementById('shoe-r');
    const armL    = document.getElementById('arm-l');
    const armR    = document.getElementById('arm-r');
    const speech  = document.getElementById('speech');

    const W = 80;
    let x = 80;
    let vx = 1.4;
    let facingRight = true;

    let isJumping = false;
    let isHugging = false;
    let jumpY = 0;
    let jumpVY = 0;
    let walkFrame = 0;
    let blinkCt = 0;
    let blinkDown = false;
    let speechTimer = 0;

    function showSpeech(text, duration = 3000) {
        speech.textContent = text;
        speech.classList.add('visible');
        setTimeout(() => speech.classList.remove('visible'), duration);
    }

    function positionSpeech() {
        const wr = wrap.getBoundingClientRect();
        let sx = wr.left + (facingRight ? 85 : -speech.offsetWidth - 10);
        let sy = wr.top - 10;
        if (sx < 4) sx = 4;
        if (sx + speech.offsetWidth > window.innerWidth - 4)
            sx = window.innerWidth - speech.offsetWidth - 4;
        speech.style.left = sx + 'px';
        speech.style.top  = sy + 'px';
    }

    const frasesNormal  = ['Hola!', 'Organiza tu dia', 'Que tal?', 'Estoy aqui para ti', 'Tienes pendientes?'];
    const frasesError   = ['Vuelve a intentarlo!', 'Casi casi!', 'No te rindas!', 'La contrasena falla...', 'Ups, intenta de nuevo!'];
    const frasesHug     = ['Bienvenido!', 'Aqui estoy!', 'Cuantas tareas hoy?'];

    const hasError = !!document.getElementById('errorAlert');

    function animateWalk(speed) {
        walkFrame += speed * 0.12;
        const swingL = Math.sin(walkFrame) * 7;
        const swingR = Math.sin(walkFrame + Math.PI) * 7;
        legL.setAttribute('transform', `rotate(${swingL}, 29, 66)`);
        legR.setAttribute('transform', `rotate(${swingR}, 51, 66)`);
        shoeL.setAttribute('transform', `rotate(${swingL * .6}, 29, 84)`);
        shoeR.setAttribute('transform', `rotate(${swingR * .6}, 51, 84)`);
        armL.setAttribute('transform', `rotate(${-swingL * .7}, 15, 50)`);
        armR.setAttribute('transform', `rotate(${-swingR * .7}, 65, 50)`);
    }

    function animateIdle() {
        walkFrame += 0.04;
        armL.setAttribute('transform', `rotate(${Math.sin(walkFrame)*8}, 15, 50)`);
        armR.setAttribute('transform', `rotate(${-Math.sin(walkFrame)*8}, 65, 50)`);
        legL.setAttribute('transform', '');
        legR.setAttribute('transform', '');
    }

    function doJump() {
        if (isJumping) return;
        isJumping = true;
        jumpVY = -14;
    }

    function doHug() {
        const card = document.getElementById('loginCard');
        if (!card || isHugging) return;
        isHugging = true;
        const rect = card.getBoundingClientRect();
        x = rect.left - W * .5;
        vx = 0;
        setTimeout(() => {
            showSpeech(frasesHug[Math.floor(Math.random()*frasesHug.length)], 2500);
            armL.setAttribute('transform', 'rotate(-60, 15, 46)');
            armR.setAttribute('transform', 'rotate(-60, 65, 46)');
            setTimeout(() => {
                armL.setAttribute('transform', '');
                armR.setAttribute('transform', '');
                isHugging = false;
                vx = -1.4;
            }, 2000);
        }, 400);
    }

    function doBlink() {
        if (blinkDown) return;
        blinkDown = true;
        const eyes = mascSvg.querySelectorAll('ellipse[rx="7"]');
        eyes.forEach(e => e.setAttribute('ry', '1'));
        setTimeout(() => {
            eyes.forEach(e => e.setAttribute('ry', '8'));
            blinkDown = false;
        }, 100);
    }

    let cursorX = window.innerWidth / 2;
    let cursorY = window.innerHeight / 2;
    document.addEventListener('mousemove', e => { cursorX = e.clientX; cursorY = e.clientY; });

    function updatePupils() {
        const wr = wrap.getBoundingClientRect();
        const cx = wr.left + 40, cy = wr.top + 50;
        const dx = cursorX - cx, dy = cursorY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxOffset = 2;
        const ox = dist > 1 ? (dx / dist) * maxOffset : 0;
        const oy = dist > 1 ? (dy / dist) * maxOffset : 0;
        pupilL.setAttribute('cx', 32 + ox);
        pupilL.setAttribute('cy', 50 + oy);
        pupilR.setAttribute('cx', 50 + ox);
        pupilR.setAttribute('cy', 50 + oy);
    }

    let frameCount = 0;
    function loop() {
        frameCount++;

        if (isJumping) {
            jumpVY += 1.0;
            jumpY  += jumpVY;
            if (jumpY >= 0) { jumpY = 0; jumpVY = 0; isJumping = false; }
        } else {
            jumpY = 0;
        }

        if (!isHugging) {
            x += vx;
            if (x <= 0)                          { x = 0;                          vx = Math.abs(vx);  facingRight = true; }
            if (x >= window.innerWidth - W - 2)  { x = window.innerWidth - W - 2; vx = -Math.abs(vx); facingRight = false; }
        }

        wrap.style.left = x + 'px';
        wrap.style.bottom = Math.max(0, -jumpY) + 'px';
        mascSvg.style.transform = facingRight ? 'scaleX(1)' : 'scaleX(-1)';

        if (isHugging) { animateIdle(); }
        else           { animateWalk(Math.abs(vx)); }

        updatePupils();

        blinkCt++;
        if (blinkCt > 200 + Math.random() * 100) { blinkCt = 0; doBlink(); }

        if (speech.classList.contains('visible')) positionSpeech();

        speechTimer++;
        if (speechTimer > 400) {
            speechTimer = 0;
            if (Math.random() < .4) {
                const arr = hasError ? frasesError : frasesNormal;
                showSpeech(arr[Math.floor(Math.random()*arr.length)], 2800);
            }
        }

        if (!isHugging && !isJumping && frameCount % 600 === 0 && Math.random() < .4) {
            doHug();
        }

        requestAnimationFrame(loop);
    }

    mascSvg.addEventListener('click', () => { doJump(); showSpeech('Yuhu!', 1500); });

    setTimeout(() => {
        if (hasError) {
            showSpeech('Vuelve a intentarlo!', 3000);
            mouth.setAttribute('d', 'M33 63 Q40 57 47 63');
        } else {
            showSpeech('Bienvenido!', 2800);
        }
    }, 800);

    setInterval(() => {
        const card = document.getElementById('loginCard');
        if (!card || isHugging) return;
        const rect = card.getBoundingClientRect();
        const mascRight = x + W;
        if (mascRight > rect.left - 20 && mascRight < rect.left + 20 && Math.random() < .3) {
            doHug();
        }
    }, 1500);

    loop();
</script>
</body>
</html>
