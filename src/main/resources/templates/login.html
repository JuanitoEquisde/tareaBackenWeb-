<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - NotyGo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <style>
        /* ─── Reset & Base ─── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --brand-1: #1a2e4a;
            --brand-2: #2563eb;
            --brand-3: #3b82f6;
            --brand-accent: #60a5fa;
            --brand-light: #eff6ff;
            --surface: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
            --shadow-md: 0 4px 24px rgba(37,99,235,.10), 0 1px 4px rgba(0,0,0,.06);
            --shadow-lg: 0 20px 60px rgba(30,64,175,.18), 0 4px 20px rgba(0,0,0,.06);
            --radius: 18px;
            --radius-sm: 10px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #F3F4F6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ─── Animated background blobs ─── */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: .55;
            pointer-events: none;
            animation: blobFloat 8s ease-in-out infinite alternate;
        }
        body::before {
            width: 520px; height: 520px;
            background: radial-gradient(circle, #bfdbfe 0%, #93c5fd 60%, transparent 100%);
            top: -160px; left: -160px;
        }
        body::after {
            width: 420px; height: 420px;
            background: radial-gradient(circle, #dbeafe 0%, #bfdbfe 60%, transparent 100%);
            bottom: -140px; right: -100px;
            animation-direction: alternate-reverse;
            animation-duration: 10s;
        }

        @keyframes blobFloat {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(30px, 20px) scale(1.06); }
        }

        /* ─── Card Container ─── */
        .login-container {
            display: flex;
            width: 900px;
            max-width: 96vw;
            min-height: 560px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: cardIn .7s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ─── Geometric / Brand Panel ─── */
        .geometric-panel {
            flex: 0 0 42%;
            background: linear-gradient(145deg, var(--brand-1) 0%, #1e3a6e 50%, var(--brand-2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 2.5rem;
        }

        /* Decorative circles */
        .geometric-panel::before {
            content: '';
            position: absolute;
            width: 320px; height: 320px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,.08);
            top: -80px; right: -80px;
            animation: rotateSlow 18s linear infinite;
        }
        .geometric-panel::after {
            content: '';
            position: absolute;
            width: 220px; height: 220px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,.06);
            bottom: -60px; left: -60px;
            animation: rotateSlow 24s linear infinite reverse;
        }

        @keyframes rotateSlow {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Floating dots grid */
        .dots-grid {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,.12) 1px, transparent 1px);
            background-size: 28px 28px;
            animation: gridDrift 20s linear infinite;
        }
        @keyframes gridDrift {
            from { background-position: 0 0; }
            to   { background-position: 28px 28px; }
        }

        .brand-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: #fff;
            animation: brandIn .9s cubic-bezier(.22,1,.36,1) .2s both;
        }
        @keyframes brandIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand-content .icon-wrap {
            width: 78px; height: 78px;
            background: rgba(255,255,255,.13);
            border: 1.5px solid rgba(255,255,255,.22);
            border-radius: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(8px);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(96,165,250,.3); }
            50%      { box-shadow: 0 0 0 14px rgba(96,165,250,.0); }
        }

        .brand-content i {
            font-size: 2rem;
            color: var(--brand-accent);
        }

        .brand-content h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 2.6rem;
            letter-spacing: -.5px;
            margin-bottom: .6rem;
            line-height: 1;
        }

        .brand-content p {
            font-size: .9rem;
            color: rgba(255,255,255,.65);
            font-weight: 400;
            letter-spacing: .01em;
        }

        /* Decorative badge */
        .brand-badge {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,.1);
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 20px;
            padding: .35rem 1rem;
            font-size: .72rem;
            color: rgba(255,255,255,.6);
            letter-spacing: .06em;
            text-transform: uppercase;
            backdrop-filter: blur(6px);
            white-space: nowrap;
        }

        /* ─── Form Panel ─── */
        .form-panel {
            flex: 1;
            padding: 3rem 3.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: formIn .8s cubic-bezier(.22,1,.36,1) .1s both;
        }
        @keyframes formIn {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .form-panel h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 2rem;
            color: var(--text-primary);
            margin-bottom: .4rem;
            letter-spacing: -.3px;
        }

        .form-subtitle {
            font-size: .875rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        /* ─── Alert ─── */
        .alert-danger {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            border-radius: var(--radius-sm);
            font-size: .85rem;
            padding: .75rem 1rem;
            margin-bottom: 1.4rem;
            animation: shakeIn .4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shakeIn {
            0%,100% { transform: translateX(0); }
            20%,60%  { transform: translateX(-6px); }
            40%,80%  { transform: translateX(6px); }
        }

        /* ─── Form Controls ─── */
        .form-label {
            font-size: .8rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: .03em;
            text-transform: uppercase;
            margin-bottom: .45rem;
        }

        .form-control {
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: .7rem 1rem;
            font-size: .9rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            background: var(--brand-light);
            transition: border-color .25s, box-shadow .25s, background .25s;
        }
        .form-control::placeholder { color: var(--text-muted); }
        .form-control:focus {
            outline: none;
            border-color: var(--brand-3);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(59,130,246,.12);
        }

        /* ─── Password wrapper ─── */
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 3rem;
        }
        .toggle-password {
            position: absolute;
            right: .9rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: .2rem .3rem;
            cursor: pointer;
            color: var(--text-muted);
            font-size: .95rem;
            transition: color .2s, transform .2s;
            line-height: 1;
        }
        .toggle-password:hover { color: var(--brand-2); transform: translateY(-50%) scale(1.15); }
        .toggle-password:focus { outline: none; }
        .toggle-password .fa-eye-slash { display: none; }
        .toggle-password.active .fa-eye      { display: none; }
        .toggle-password.active .fa-eye-slash { display: inline; }

        /* ─── Checkbox ─── */
        .form-check-input {
            border-radius: 5px;
            border: 1.5px solid var(--border);
            cursor: pointer;
        }
        .form-check-input:checked {
            background-color: var(--brand-2);
            border-color: var(--brand-2);
        }
        .form-check-label {
            font-size: .875rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        /* ─── Button ─── */
        .btn-primary {
            background: linear-gradient(135deg, var(--brand-2) 0%, #1d4ed8 100%);
            border: none;
            border-radius: var(--radius-sm);
            padding: .8rem 1rem;
            font-size: .95rem;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: .02em;
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: transform .2s, box-shadow .2s;
            box-shadow: 0 4px 16px rgba(37,99,235,.35);
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 60%);
            pointer-events: none;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37,99,235,.45);
            background: linear-gradient(135deg, #3b82f6 0%, var(--brand-2) 100%);
        }
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(37,99,235,.3);
        }

        /* Ripple on click */
        .btn-primary .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,.28);
            transform: scale(0);
            animation: rippleAnim .55s linear;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        /* ─── Links ─── */
        .text-center a, .text-center span {
            font-size: .875rem;
        }
        a.text-decoration-none {
            color: var(--brand-2);
            font-weight: 500;
            position: relative;
            transition: color .2s;
        }
        a.text-decoration-none::after {
            content: '';
            position: absolute;
            left: 0; bottom: -1px;
            width: 0; height: 1.5px;
            background: var(--brand-3);
            transition: width .25s;
        }
        a.text-decoration-none:hover { color: #1d4ed8; }
        a.text-decoration-none:hover::after { width: 100%; }

        .text-center span { color: var(--text-muted); }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: .75rem;
            margin: 1.4rem 0;
            color: var(--text-muted);
            font-size: .75rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ─── Responsive ─── */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                min-height: unset;
                max-width: 98vw;
                border-radius: 16px;
            }
            .geometric-panel {
                flex: 0 0 auto;
                padding: 2.2rem 1.5rem 2.8rem;
            }
            .brand-content h1 { font-size: 2rem; }
            .brand-badge { position: static; transform: none; margin-top: 1rem; display: inline-block; }
            .form-panel {
                padding: 2rem 1.8rem 2.4rem;
            }
            .form-panel h2 { font-size: 1.6rem; }
        }

        @media (max-width: 420px) {
            .geometric-panel { padding: 1.8rem 1.2rem 2rem; }
            .form-panel { padding: 1.6rem 1.2rem 2rem; }
            .brand-content .icon-wrap { width: 62px; height: 62px; }
        }
    </style>
</head>
<body>

<div class="login-container">
    <!-- Brand Panel -->
    <div class="geometric-panel">
        <div class="dots-grid"></div>
        <div class="brand-content">
            <div class="icon-wrap">
                <i class="fas fa-calendar-check"></i>
            </div>
            <h1>NotyGo</h1>
            <p>Gestiona tu tiempo eficientemente</p>
        </div>
        <div class="brand-badge">✦ Organiza · Recuerda · Logra</div>
    </div>

    <!-- Form Panel -->
    <div class="form-panel">
        <h2>Iniciar Sesión</h2>
        <p class="form-subtitle">Bienvenido de vuelta, ingresa tus datos.</p>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}">Correo o contraseña incorrecta</span>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="tu@email.com" required autofocus>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="••••••••" required>
                    <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">
                        <i class="fas fa-eye"></i>
                        <i class="fas fa-eye-slash"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
                <label class="form-check-label" for="rememberMe">Recordarme</label>
            </div>

            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                Iniciar Sesión
            </button>

            <div class="divider">o</div>

            <div class="text-center">
                <a th:href="@{/login/invitado}" class="text-decoration-none">
                    <i class="fas fa-user-secret me-1" style="font-size:.8rem"></i>
                    Continuar como Invitado
                </a>
            </div>

            <div class="text-center mt-2">
                <span>¿No tienes una cuenta? </span>
                <a th:href="@{/registro}" class="text-decoration-none">Regístrate</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /* ── Toggle password visibility ── */
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        toggleBtn.classList.toggle('active');

        /* micro-bounce */
        toggleBtn.style.transform = 'translateY(-50%) scale(1.3)';
        setTimeout(() => { toggleBtn.style.transform = 'translateY(-50%) scale(1)'; }, 180);
    });

    /* ── Ripple effect on submit button ── */
    const submitBtn = document.getElementById('submitBtn');
    submitBtn.addEventListener('click', function (e) {
        const ripple = document.createElement('span');
        ripple.classList.add('ripple');
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.cssText = `
            width:${size}px; height:${size}px;
            left:${e.clientX - rect.left - size/2}px;
            top:${e.clientY - rect.top - size/2}px;
        `;
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });

    /* ── Staggered input focus glow on load ── */
    document.querySelectorAll('.form-control').forEach((el, i) => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(10px)';
        el.style.transition = `opacity .4s ease ${i * .1 + .3}s, transform .4s ease ${i * .1 + .3}s, border-color .25s, box-shadow .25s, background .25s`;
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                el.style.opacity = '1';
                el.style.transform = 'translateY(0)';
            });
        });
    });
</script>
</body>
</html>
