<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - NotyGo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tu CSS personalizado (ruta correcta para Thymeleaf) -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="registro-container">
    <div class="form-panel">
        <h2 class="text-center mb-4">Crea tu cuenta Estándar</h2>

        <form th:action="@{/registro}" method="post">
            <div class="form-group mb-3">
                <label class="form-label" for="nombre">Nombre completo</label>
                <input type="text" id="nombre" class="form-control" name="nombre"
                       placeholder="Ingresa tu nombre" required>
            </div>

            <div class="form-group mb-3">
                <label class="form-label" for="email">Correo electrónico</label>
                <input type="email" id="email" class="form-control" name="email"
                       placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group mb-4">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" class="form-control" name="password"
                       placeholder="••••••••" required>
            </div>

            <input type="hidden" name="rol" value="ESTANDAR">

            <button type="submit" class="btn btn-register w-100">Registrarme</button>

            <div class="text-center mt-4">
                <a th:href="@{/login}" class="link-login">← Volver al Login</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
