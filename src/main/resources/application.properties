spring.application.name=easydateapp

# ==========================================
# ? CONFIGURACIÓN DE DATA SOURCE (MYSQL)
# ==========================================
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/easydates?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# ? CONFIGURACIÓN DE HIBERNATE / JPA
# ==========================================
# Spring Boot 3.x detecta automáticamente el dialecto de MySQL
# ? ELIMINADO: spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Actualiza las tablas automáticamente según tus entidades
spring.jpa.hibernate.ddl-auto=update

# Muestra las consultas SQL en la consola (útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# ? CONFIGURACIÓN ADICIONAL RECOMENDADA
# ==========================================
# Logging para ver detalles de JPA/Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Tamaño del pool de conexiones (opcional, mejora rendimiento)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5